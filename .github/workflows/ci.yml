# CI — KR 4.1, 4.2, 4.3, 4.4
#
# Runs unit tests for every service and the new listener/parser/firer
# suites on every push and pull_request to main. Also runs the linter
# (KR 4.4) so style violations block the build.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # KR 4.2 — wire in the existing service tests
      - name: Run Drive service tests
        run: node --test test/google-drive/

      - name: Run Coda service tests
        run: node --test test/coda-service.test.js

      - name: Run IMAP service tests
        run: node --test test/imap-service.test.js

      # KR 4.3 — wire in the new module tests (Epics 1–3)
      - name: Run listener tests
        run: node --test test/new-message-detector.test.js

      #- name: Run parser tests
      #  run: node --test test/parser-service.test.js

      #- name: Run firer tests
      #  run: node --test test/firer-service.test.js

      # KR 4.4 — lint (uses eslint.config.js at the repo root)
      - name: Lint
        run: npx eslint services/ test/ *.js scripts/
